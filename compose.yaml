
services:
  postgres:
    image: postgres:17
    container_name: greenleaf-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: greenleaf
      POSTGRES_USER: greenleaf
      POSTGRES_PASSWORD: localdevpassword
    ports:
      - "5432:5432"
    volumes:
      - greenleaf-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U greenleaf -d greenleaf"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  greenleaf-postgres-data:
